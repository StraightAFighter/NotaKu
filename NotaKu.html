<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Nota & Ulangkaji Pintar</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800">

    <div class="max-w-4xl mx-auto p-4 sm:p-6">
        <!-- Tajuk Utama -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-indigo-600">Nota & Ulangkaji Pintar</h1>
            <p class="text-slate-500 mt-1">Subjek > Bab > Tajuk dengan Warna, Highlight & Kuiz Soal Jawab</p>
        </header>

        <!-- Navigasi Tab -->
        <div class="flex justify-center mb-6 space-x-2 border-b border-slate-200 pb-2">
            <button onclick="switchTab('notes')" id="btn-notes" class="px-4 py-2 font-semibold text-indigo-600 border-b-2 border-indigo-600 transition">Tulis & Susun Nota</button>
            <button onclick="switchTab('quiz')" id="btn-quiz" class="px-4 py-2 font-semibold text-slate-500 hover:text-indigo-600 transition">Mod Kuiz & Ulangkaji</button>
        </div>

        <!-- TAB 1: NOTA -->
        <div id="tab-notes" class="space-y-6">
            <!-- Borang Tambah Nota -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-lg font-bold mb-4 text-slate-700">Tambah / Rangkum Nota Baru</h2>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Subjek</label>
                        <input type="text" id="subject" placeholder="cth: Matematik Tambahan" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Bab</label>
                        <input type="text" id="chapter" placeholder="cth: Bab 1 - Fungsi" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Tajuk</label>
                        <input type="text" id="topic" placeholder="cth: Jenis-jenis Fungsi" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>

                <div class="mb-4">
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-semibold uppercase text-slate-500">Nota / Rkapan</label>
                        <button type="button" onclick="addHighlight()" class="text-xs bg-amber-100 text-amber-800 px-2 py-1 rounded font-medium hover:bg-amber-200">Highlight Teks Dipilih</button>
                    </div>
                    <textarea id="content" rows="4" placeholder="Tulis nota atau rangkuman di sini..." class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                </div>

                <!-- Pilihan Warna Nota & Soalan Kuiz -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Warna Kad Nota</label>
                        <div class="flex space-x-3 mt-1">
                            <label class="cursor-pointer"><input type="radio" name="color" value="bg-amber-50 border-amber-200" checked class="accent-amber-500"> <span class="inline-block w-6 h-6 rounded-full bg-amber-100 border align-middle"></span></label>
                            <label class="cursor-pointer"><input type="radio" name="color" value="bg-emerald-50 border-emerald-200" class="accent-emerald-500"> <span class="inline-block w-6 h-6 rounded-full bg-emerald-100 border align-middle"></span></label>
                            <label class="cursor-pointer"><input type="radio" name="color" value="bg-sky-50 border-sky-200" class="accent-sky-500"> <span class="inline-block w-6 h-6 rounded-full bg-sky-100 border align-middle"></span></label>
                            <label class="cursor-pointer"><input type="radio" name="color" value="bg-rose-50 border-rose-200" class="accent-rose-500"> <span class="inline-block w-6 h-6 rounded-full bg-rose-100 border align-middle"></span></label>
                            <label class="cursor-pointer"><input type="radio" name="color" value="bg-purple-50 border-purple-200" class="accent-purple-500"> <span class="inline-block w-6 h-6 rounded-full bg-purple-100 border align-middle"></span></label>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Soalan Soal Jawab (Pilihan untuk Kuiz)</label>
                        <input type="text" id="quizQ" placeholder="Soalan untuk ulangkaji (cth: Apakah definisi fungsi?)" class="w-full p-2 text-sm border rounded-lg mb-2">
                        <input type="text" id="quizA" placeholder="Jawapan" class="w-full p-2 text-sm border rounded-lg">
                    </div>
                </div>

                <button onclick="saveNote()" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-lg hover:bg-indigo-700 transition shadow">Simpan Nota</button>
            </div>

            <!-- Senarai Nota -->
            <div>
                <h3 class="text-xl font-bold mb-4 text-slate-700">Senarai Nota Tersimpan</h3>
                <div id="notes-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Nota akan dimasukkan secara dinamik di sini -->
                </div>
            </div>
        </div>

        <!-- TAB 2: QUIZ / SOAL JAWAB -->
        <div id="tab-quiz" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 text-center">
                <h2 class="text-xl font-bold mb-2 text-slate-700">Mod Ulangkaji Soal Jawab</h2>
                <p class="text-slate-500 mb-6">Uji kefahaman anda berdasarkan nota yang telah anda tulis.</p>

                <div id="quiz-container" class="min-h-[200px] flex flex-col items-center justify-center">
                    <p class="text-slate-400 italic">Tiada soalan dicipta lagi. Sila masukkan soalan semasa menulis nota.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let notes = JSON.parse(localStorage.getItem('smart_notes')) || [];

        function switchTab(tab) {
            if (tab === 'notes') {
                document.getElementById('tab-notes').classList.remove('hidden');
                document.getElementById('tab-quiz').classList.add('hidden');
                document.getElementById('btn-notes').className = "px-4 py-2 font-semibold text-indigo-600 border-b-2 border-indigo-600 transition";
                document.getElementById('btn-quiz').className = "px-4 py-2 font-semibold text-slate-500 hover:text-indigo-600 transition";
            } else {
                document.getElementById('tab-notes').classList.add('hidden');
                document.getElementById('tab-quiz').classList.remove('hidden');
                document.getElementById('btn-quiz').className = "px-4 py-2 font-semibold text-indigo-600 border-b-2 border-indigo-600 transition";
                document.getElementById('btn-notes').className = "px-4 py-2 font-semibold text-slate-500 hover:text-indigo-600 transition";
                loadQuiz();
            }
        }

        function addHighlight() {
            const textarea = document.getElementById('content');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            if (start === end) return;
            const text = textarea.value;
            const highlighted = `<mark class="bg-yellow-200 px-1 rounded">${text.substring(start, end)}</mark>`;
            textarea.value = text.substring(0, start) + highlighted + text.substring(end);
        }

        function saveNote() {
            const subject = document.getElementById('subject').value.trim();
            const chapter = document.getElementById('chapter').value.trim();
            const topic = document.getElementById('topic').value.trim();
            const content = document.getElementById('content').value.trim();
            const color = document.querySelector('input[name="color"]:checked').value;
            const quizQ = document.getElementById('quizQ').value.trim();
            const quizA = document.getElementById('quizA').value.trim();

            if (!subject || !chapter || !topic || !content) {
                alert('Sila lengkapkan maklumat Subjek, Bab, Tajuk dan Kandungan Nota!');
                return;
            }

            const newNote = { id: Date.now(), subject, chapter, topic, content, color, quizQ, quizA };
            notes.push(newNote);
            localStorage.setItem('smart_notes', JSON.stringify(notes));

            // Reset form
            document.getElementById('topic').value = '';
            document.getElementById('content').value = '';
            document.getElementById('quizQ').value = '';
            document.getElementById('quizA').value = '';

            renderNotes();
            alert('Nota berjaya disimpan!');
        }

        function deleteNote(id) {
            notes = notes.filter(n => n.id !== id);
            localStorage.setItem('smart_notes', JSON.stringify(notes));
            renderNotes();
        }

        function renderNotes() {
            const list = document.getElementById('notes-list');
            if (notes.length === 0) {
                list.innerHTML = `<p class="text-slate-400 italic col-span-2 text-center py-8">Belum ada nota lagi. Jom mula menulis!</p>`;
                return;
            }

            list.innerHTML = notes.map(n => `
                <div class="p-5 rounded-2xl border ${n.color} shadow-sm relative flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xs font-bold uppercase tracking-wider bg-white/60 px-2 py-0.5 rounded text-indigo-700">${n.subject}</span>
                            <button onclick="deleteNote(${n.id})" class="text-slate-400 hover:text-red-500 font-bold">&times;</button>
                        </div>
                        <h4 class="font-bold text-slate-800 text-base">${n.chapter}</h4>
                        <h5 class="font-semibold text-slate-600 text-sm mb-3">📍 ${n.topic}</h5>
                        <div class="text-slate-700 text-sm whitespace-pre-wrap mb-4 bg-white/50 p-3 rounded-lg border border-black/5">${n.content}</div>
                    </div>
                    ${n.quizQ ? `<div class="text-xs bg-indigo-50 text-indigo-800 p-2 rounded border border-indigo-100 mt-2"><strong>Soalan Ulangkaji:</strong> ${n.quizQ}</div>` : ''}
                </div>
            `).join('');
        }

        let currentQuizIndex = 0;
        let showAnswerState = false;

        function loadQuiz() {
            const quizContainer = document.getElementById('quiz-container');
            const validQuizzes = notes.filter(n => n.quizQ && n.quizA);

            if (validQuizzes.length === 0) {
                quizContainer.innerHTML = `<p class="text-slate-400 italic">Tiada soalan kuiz dijumpai. Sila masukkan soalan dan jawapan ketika menulis nota.</p>`;
                return;
            }

            if (currentQuizIndex >= validQuizzes.length) currentQuizIndex = 0;
            const q = validQuizzes[currentQuizIndex];

            quizContainer.innerHTML = `
                <div class="w-full max-w-lg bg-slate-50 p-6 rounded-xl border border-slate-200 text-left mb-4">
                    <span class="text-xs font-semibold text-indigo-600 uppercase">Soalan ${currentQuizIndex + 1} dari ${validQuizzes.length}</span>
                    <h3 class="text-lg font-bold text-slate-800 mt-2 mb-4">${q.quizQ}</h3>
                    <div id="answer-box" class="hidden bg-emerald-50 border border-emerald-200 p-3 rounded-lg text-emerald-900 mb-4 text-sm">
                        <strong>Jawapan:</strong> ${q.quizA}
                    </div>
                </div>
                <div class="flex space-x-3">
                    <button onclick="toggleAnswer()" class="bg-slate-200 text-slate-700 px-4 py-2 rounded-lg font-semibold hover:bg-slate-300 transition">Paparkan Jawapan</button>
                    <button onclick="nextQuiz(${validQuizzes.length})" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-indigo-700 transition">Soalan Seterusnya</button>
                </div>
            `;
        }

        function toggleAnswer() {
            const ansBox = document.getElementById('answer-box');
            if (ansBox) ansBox.classList.toggle('hidden');
        }

        function nextQuiz(max) {
            currentQuizIndex = (currentQuizIndex + 1) % max;
            loadQuiz();
        }

        // Paparkan nota semasa mula-mula buka
        renderNotes();
    </script>
</body>
</html>
